<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPE Course Platform</title>
  <link rel="stylesheet" href="styles.css?v=20260924-3">
</head>
<body>
  <header>
    <div>
      <h1>MPE Course Platform</h1>
      <p>Course participation, completion, feedback and insights</p>
    </div>
    <div id="connection" class="status">Connecting to the local data service…</div>
  </header>

  <div class="layout">
    <aside>
      <label for="course">Course</label>
      <select id="course"></select>
      <label for="offering">Teaching period</label>
      <select id="offering"></select>

      <nav aria-label="Page navigation">
        <button data-page="overview" class="active">Overview</button>
        <button data-page="engagement">Engagement</button>
        <button data-page="assignments">Assignments</button>
        <button data-page="outcomes">Feedback</button>
        <button data-page="insights">Insights</button>
        <button data-page="data-rules">Data & Rules</button>
      </nav>
    </aside>

    <main>
      <section id="pageHeader" class="page-header">
        <div>
          <h2 id="pageTitle">Overview</h2>
          <p id="cohort"></p>
        </div>
        <div id="pageFilters" class="filters"></div>
      </section>
      <div id="message" class="message" hidden></div>
      <section id="metrics" class="cards"></section>
      <section id="coverage"></section>
      <section id="modelPanel"></section>
      <section id="tables"></section>
      <section id="notes"></section>
    </main>
  </div>
  <script type="module" src="app.js?v=20260924-3"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPE Course Platform</title>
  <style>
:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #202124;
  background: #f4f5f7;
}
* { box-sizing: border-box; }
body { margin: 0; }
header {
  min-height: 76px;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  color: white;
  background: #25344a;
}
h1, h2, h3 { margin: 0; }
header p { margin: 6px 0 0; color: #d7deea; }
.status { padding: 8px 12px; border: 1px solid #64748b; border-radius: 4px; }
.status.ok { color: #d1fae5; border-color: #4ade80; }
.status.error { color: #fee2e2; border-color: #f87171; }
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 76px); }
aside { padding: 20px 16px; background: white; border-right: 1px solid #d8dde5; }
label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: bold; }
select, button { font: inherit; }
select { width: 100%; padding: 8px; margin-bottom: 14px; border: 1px solid #adb5bd; border-radius: 3px; background: white; }
select:disabled { color:#667085; background:#eef1f4; cursor:not-allowed; }
nav { margin-top: 18px; display: grid; gap: 6px; }
nav button {
  padding: 10px 12px;
  border: 0;
  border-radius: 3px;
  text-align: left;
  color: #303846;
  background: transparent;
  cursor: pointer;
}
nav button:hover, nav button.active { color: white; background: #355b88; }
main { min-width: 0; padding: 22px; }
.page-header { display: flex; justify-content: space-between; gap: 20px; align-items: start; margin-bottom: 18px; }
.page-header p { margin: 6px 0 0; color: #667085; }
.filters { display: flex; align-items: end; gap: 10px; flex-wrap: wrap; }
.filters label { min-width: 130px; }
.filters select { margin: 4px 0 0; }
.filters button, .action {
  padding: 8px 12px;
  border: 1px solid #355b88;
  border-radius: 3px;
  color: white;
  background: #355b88;
  cursor: pointer;
}
.filters button:disabled { cursor: wait; opacity: .6; }
.message { margin-bottom: 16px; padding: 12px; border-left: 4px solid #b45309; background: #fff7ed; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; }
.card, .panel, details, .visual { padding: 14px; border: 1px solid #d8dde5; border-radius: 4px; background: white; }
.card .label { color: #667085; font-size: 13px; }
.card .value { margin-top: 8px; font-size: 24px; font-weight: bold; }
.panel { margin-bottom: 16px; }
.panel h3 { margin-bottom: 10px; }
details { margin-bottom: 12px; padding: 0; overflow: hidden; }
summary { padding: 12px 14px; font-weight: bold; cursor: pointer; background: #eef2f6; }
.visual { margin-bottom: 16px; }
.visual > h3 { margin-bottom: 12px; }
.visual details { margin: 12px 0 0; border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; }
.chart { padding: 10px; border: 1px solid #e2e6eb; background: #fbfcfd; overflow-x: auto; }
.chart-title { margin-bottom: 6px; color: #4b5563; font-size: 13px; font-weight: bold; }
.chart svg { display: block; width: 100%; min-width: 620px; max-height: 430px; }
.chart svg text { fill: #4b5563; font-size: 12px; }
.chart .axis { stroke: #9ca3af; stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 6px 0 0 50px; font-size: 12px; }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 3px; display: inline-block; }
.chart-note { margin: 6px 0 0; color: #667085; font-size: 12px; }
.text-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.text-card { padding: 14px; border-left: 4px solid #355b88; background: #f7f9fc; }
.text-card p { margin: 6px 0; white-space: pre-wrap; }
.text-card small, .text-meta { color: #667085; }
.text-card strong { display: block; margin-top: 8px; font-size: 12px; }
.table-wrap { max-width: 100%; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; border: 1px solid #dfe3e8; text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: #f7f8fa; }
.hidden-value { color: #9a3412; }
.unavailable { color: #667085; }
.notes { margin-top: 16px; color: #566070; }
.loading { opacity: .55; pointer-events: none; }
@media (max-width: 780px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid #d8dde5; }
  nav { grid-template-columns: repeat(2, 1fr); }
  .page-header { display: block; }
  .filters { margin-top: 12px; }
}

/* Visual page modules. */
.viz-metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.viz-metrics.hero .viz-kpi:first-child { background:linear-gradient(180deg,#edf5ff,#fff); }
.viz-kpi { padding:15px; border:1px solid #dde3eb; border-radius:9px; background:#fff; }
.viz-kpi span,.viz-kpi small { display:block; color:#667085; font-size:12px; }
.viz-kpi strong { display:block; margin:5px 0; color:#172033; font-size:25px; }
#tables.special-page { display:block; }
#metrics.special-page { display:block; }
.viz-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(390px,1fr)); gap:16px; }
.viz-panel { min-width:0; margin-bottom:16px; padding:16px; overflow:hidden; border:1px solid #dde3eb; border-radius:9px; background:#fff; box-shadow:0 1px 2px #1720330d; }
.viz-panel.wide { grid-column:1/-1; }
.viz-panel>header,.page-section>header,.model-card>header { min-height:0; padding:0; color:inherit; background:transparent; }
.viz-panel>header { display:flex; justify-content:space-between; align-items:start; margin-bottom:12px; }
.viz-panel h3,.page-section h3 { margin:0; font-size:17px; }
.viz-panel h4 { margin:0 0 8px; color:#475467; font-size:13px; }
.viz-panel header p,.page-section>header p { margin:4px 0 0; color:#667085; font-size:12px; }
.empty { color:#758195; }
.attention-card { grid-column:1/-1; margin-bottom:16px; padding:14px 16px; border:1px solid #e3ad62; border-left:5px solid #d9792b; border-radius:8px; background:#fff8ed; color:#684312; }
.attention-card strong,.attention-card p { display:block; margin:0; }
.attention-card p { margin-top:5px; font-size:12px; line-height:1.5; }
.embedded-details { margin:14px 0 0; border:1px solid #dde3eb; border-radius:7px; }
.embedded-details>p { margin:10px 12px; color:#667085; font-size:11px; }
.embedded-details>.mini-grid { padding:0 12px 12px; }
.legend { display:flex; flex-wrap:wrap; gap:7px 14px; margin-top:9px; color:#667085; font-size:11px; }
.legend span { display:inline-flex; align-items:center; gap:5px; }
.legend i { width:9px; height:9px; border-radius:2px; }
.hbars { display:grid; gap:8px; }
.hbar { display:grid; grid-template-columns:minmax(120px,34%) 1fr 62px; gap:9px; align-items:center; font-size:12px; }
.hbar>span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hbar>div { height:12px; overflow:hidden; border-radius:6px; background:#edf0f4; }
.hbar>div i { display:block; height:100%; border-radius:6px; background:#2878b5; }
.hbar b { text-align:right; }
.column-chart { overflow-x:auto; }
.column-groups { display:flex; min-width:max-content; height:250px; gap:20px; padding:15px 15px 0; border-bottom:1px solid #aab4c2; align-items:end; }
.column-group { width:95px; flex:1 0 80px; text-align:center; }
.columns { display:flex; height:205px; align-items:end; justify-content:center; gap:5px; }
.column { display:flex; width:34px; height:100%; flex-direction:column; justify-content:end; align-items:center; }
.column b { margin-bottom:4px; font-size:9px; font-weight:600; color:#475467; white-space:nowrap; }
.column i { display:block; width:22px; max-height:calc(100% - 18px); min-height:1px; border-radius:3px 3px 0 0; }
.column-group>span { display:block; margin-top:7px; font-size:10px; }
.stack-list { display:grid; gap:10px; }
.stack-row { display:grid; grid-template-columns:minmax(130px,25%) 1fr 55px; align-items:center; gap:10px; font-size:12px; }
.stack-row>span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stack-track { display:flex; min-height:28px; overflow:hidden; border-radius:5px; background:#edf0f4; }
.stack-track i { display:flex; min-width:0; align-items:center; justify-content:center; color:#fff; font-size:10px; font-style:normal; }
.stack-row>b { text-align:right; }
.line-chart svg { display:block; width:100%; min-height:190px; }
.line-chart .axis { stroke:#aab4c2; }
.line-chart .chart-grid { stroke:#e6ebf2; stroke-dasharray:3 4; }
.line-chart .timeline-marker { stroke-width:1.5; stroke-dasharray:5 4; }
.line-chart .timeline-label { font-weight:700; font-size:9px; }
.timeline-key { width:16px!important; height:0!important; border-top:2px dashed; background:transparent!important; }
.line-chart text { fill:#667085; font-size:10px; }
.key-insight { display:grid; grid-template-columns:minmax(150px,22%) 1fr; gap:8px 14px; align-items:start; margin-top:14px; padding:13px 15px; border:1px solid #b8d3ff; border-radius:8px; background:#f2f7ff; }
.key-insight-heading strong { display:block; color:#1452a3; font-size:16px; }
.key-insight-heading span,.key-insight>small { display:block; color:#667085; font-size:11px; line-height:1.45; }
.key-insight textarea { min-height:74px; padding:10px; resize:vertical; border:1px solid #cbd8ea; border-radius:6px; font:inherit; font-size:13px; line-height:1.5; }
.key-insight-actions { grid-column:2; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.key-insight-actions span { margin-right:auto; color:#667085; font-size:11px; }
.key-insight-actions button { padding:7px 11px; border:1px solid #b8c8df; border-radius:5px; background:#fff; cursor:pointer; }
.key-insight>small { grid-column:2; }
.page-actions { display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
.page-actions>button { border:1px solid #b7c8db; background:#fff; border-radius:6px; padding:9px 12px; cursor:pointer; }
.chart-subtitle { margin:5px 0!important; color:#344054!important; font-size:13px!important; line-height:1.4; }
.chart-purpose { margin:4px 0 10px!important; color:#667085!important; font-size:11px!important; line-height:1.4; }
.insight-editor { min-width:0; }
.insight-text { margin:0 0 6px; font-size:13px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
.insight-editor>details { padding:0; border:0; background:transparent; }
.insight-editor summary { padding:4px 0; font-size:11px; color:#1452a3; }
.insight-editor textarea { display:block; box-sizing:border-box; width:100%; margin:6px 0; }
.insight-editor .key-insight-actions { display:flex; }
.submission-chart { overflow-x:auto; }
.submission-chart svg { display:block; width:100%; min-width:620px; }
.submission-chart svg text { font-family:inherit; font-size:12px; }
.submission-series-controls { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:8px 0 2px; }
.submission-series-toggle { display:inline-flex; align-items:center; gap:7px; padding:6px 10px; border:1px solid #cfd7e3; border-radius:16px; background:#fff; color:#667085; cursor:pointer; font:inherit; font-size:11px; }
.submission-series-toggle i { width:10px; height:10px; border-radius:50%; }
.submission-series-toggle small { display:block; color:#9a6700; font-size:9px; }
.submission-series-toggle.selected { border-color:#6e8fb4; background:#eef5fc; color:#183b63; font-weight:700; }
.deadline-warning { display:flex; gap:8px; align-items:baseline; margin:8px 12px; padding:8px 10px; border-left:3px solid #d9792b; background:#fff7ed; color:#704214; font-size:10px; }
.deadline-warning strong { white-space:nowrap; }
.weekly-comparison .line-chart>.legend { display:none; }
.period-legend button { display:flex; align-items:center; gap:5px; border:1px solid #d5dce5; border-radius:5px; padding:7px; background:#fff; cursor:pointer; color:#667085; }
.period-legend button[aria-pressed="true"] { border-color:#355b88; background:#edf4ff; color:#172033; font-weight:600; }
.heatmap tr.selected-period>* { border-top:2px solid #355b88; border-bottom:2px solid #355b88; }
.heatmap tr.selected-period>*:first-child { border-left:2px solid #355b88; }
.heatmap tr.selected-period>*:last-child { border-right:2px solid #355b88; }
.mini-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:15px; }
.mini-viz { min-width:0; padding:12px; border:1px solid #e4e8ee; border-radius:7px; }
.heatmap-wrap { max-width:100%; overflow:auto; }
.heatmap { width:max-content; min-width:100%; border-collapse:separate; border-spacing:3px; font-size:10px; }
.heatmap th { padding:5px; color:#667085; background:transparent; text-align:center; }
.heatmap tbody th { position:sticky; left:0; min-width:120px; background:#fff; color:#344054; text-align:left; }
.heatmap td { min-width:42px; height:32px; padding:4px; background:rgb(40 120 181 / var(--heat)); color:#172033; text-align:center; }
.heat-legend { display:flex; width:190px; margin:8px 0 0 auto; gap:7px; align-items:center; color:#667085; font-size:10px; }
.heat-legend i { height:8px; flex:1; border-radius:4px; background:linear-gradient(90deg,rgb(40 120 181 / .08),rgb(40 120 181)); }
.coverage-table td { text-align:center; }
.coverage-table .available { color:#21623b; font-weight:700; }
.coverage-table .unavailable { color:#667085; }
.gauge-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:12px; }
.gauge-grid article { text-align:center; }
.gauge { display:grid; width:92px; height:92px; margin:0 auto 8px; place-items:center; border-radius:50%; background:conic-gradient(var(--colour) var(--score),#edf0f4 0); }
.gauge:before { content:""; grid-area:1/1; width:70px; height:70px; border-radius:50%; background:#fff; }
.gauge span { z-index:1; grid-area:1/1; font-weight:700; }
.gauge small,.gauge-grid article>small { display:block; color:#667085; font-size:10px; }
.nps { display:grid; grid-template-columns:150px 1fr; gap:18px; align-items:center; }
.nps-score small,.nps-score strong,.nps-score span { display:block; }
.nps-score small,.nps-score span { color:#667085; font-size:10px; }
.nps-score strong { margin:4px 0; font-size:38px; color:#174f7b; }
.nps-track { display:flex; height:22px; gap:2px; overflow:hidden; border-radius:4px; }
.nps-track i { display:block; }
.nps-breakdown { display:grid; grid-template-columns:repeat(3,minmax(100px,1fr)); gap:7px; margin:9px 0 5px; }
.nps-breakdown article { display:grid; grid-template-columns:9px 1fr; gap:2px 6px; padding:7px 8px; border:1px solid #e1e6ed; border-radius:6px; background:#f8fafc; }
.nps-breakdown article>i { grid-row:1/3; width:9px; border-radius:3px; background:var(--segment); }
.nps-breakdown span { color:#667085; font-size:10px; }
.nps-breakdown strong { color:#253247; font-size:14px; }
.survey-questions { display:grid; gap:9px; }
.survey-question-group { margin:0; border:1px solid #d7dee8; border-radius:8px; background:#fff; }
.survey-question-group>summary { display:flex; padding:13px 14px; justify-content:space-between; gap:16px; line-height:1.45; }
.survey-question-group>summary span { max-width:86%; }
.survey-question-group>summary b { margin-right:5px; color:#174f7b; }
.survey-question-group>summary small { color:#667085; white-space:nowrap; }
.survey-question-list { padding:0 13px 13px; border-top:1px solid #edf0f4; }
.survey-question-list .likert-row { padding:11px 0; border-bottom:1px solid #edf0f4; }
.survey-question-list .likert-row:last-of-type { border-bottom:0; }
.likert-row { display:grid; grid-template-columns:minmax(170px,34%) 1fr 45px 75px; gap:8px; align-items:center; font-size:11px; }
.likert-row>span { line-height:1.35; }
.likert-row>span b,.likert-row>span small { display:block; }
.likert-row>span b { color:#174f7b; }
.likert-row>span small { margin-top:3px; color:#667085; font-size:9px; }
.likert-row>div { display:flex; height:18px; gap:2px; }
.likert-row i { display:flex; min-width:0; align-items:center; justify-content:center; overflow:hidden; color:#fff; font-size:9px; font-style:normal; font-weight:700; }
.likert-legend { margin:0 0 12px; }
.feedback-bars .hbar>span { overflow:visible; white-space:normal; line-height:1.35; }
.feedback-columns .column-groups { min-width:0; gap:8px; padding-right:4px; padding-left:4px; }
.feedback-columns .column-group { width:auto; min-width:65px; flex:1 1 65px; }
.feedback-columns .column-group>span { line-height:1.25; }
.feedback-top-list { display:grid; gap:11px; }
.feedback-top-list article>div { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:start; font-size:11px; }
.feedback-top-list article>div span { line-height:1.35; }
.feedback-top-list article>i { display:block; height:10px; margin:5px 0; overflow:hidden; border-radius:5px; background:#edf0f4; }
.feedback-top-list article>i>b { display:block; height:100%; border-radius:5px; background:#2878b5; }
.feedback-top-list small { color:#667085; line-height:1.4; }
.feedback-comments { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:12px; }
.feedback-comment-topic { padding:12px; border:1px solid #dde3eb; border-radius:8px; background:#fff; }
.feedback-comment-topic>header { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
.feedback-comment-topic h4 { margin:0; }
.feedback-comment-topic>header span { color:#667085; font-size:10px; }
.feedback-comment-list { display:grid; gap:8px; margin-top:10px; }
.feedback-comment { min-height:72px; padding:10px; border-left:3px solid #2878b5; background:#f7f9fc; }
.feedback-comment p { margin:0; white-space:pre-wrap; line-height:1.45; }
.feedback-comment small { display:block; margin-top:6px; color:#667085; }
.comment-pages { display:flex; margin-top:10px; justify-content:flex-end; gap:8px; align-items:center; font-size:10px; }
.comment-pages button { padding:5px 8px; border:1px solid #cbd3df; border-radius:5px; background:#fff; cursor:pointer; }
.comment-pages button:disabled { cursor:default; opacity:.45; }
.page-empty { max-width:620px; margin:48px auto; padding:28px; border:1px solid #d8dee7; border-radius:9px; background:#fff; text-align:center; }
.page-empty strong { display:block; color:#253247; font-size:18px; }
.page-empty p { margin:8px 0 0; color:#667085; }
.chips,.outcome-tabs { display:flex; flex-wrap:wrap; gap:5px; margin:10px 0 14px; }
.chips button,.outcome-tabs button { padding:7px 11px; border:1px solid #cbd3df; border-radius:6px; background:#fff; color:#475467; cursor:pointer; }
.chips button.active,.outcome-tabs button.active { border-color:#2878b5; background:#eaf3fb; color:#174f7b; }
.issue-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px; }
.issue-list article { position:relative; overflow:hidden; padding:12px; border:1px solid #e4e8ee; border-radius:7px; }
.issue-list article>div { display:flex; justify-content:space-between; color:#667085; font-size:10px; }
.issue-list p { position:relative; z-index:1; margin:7px 0 4px; }
.issue-list article>i { position:absolute; left:0; bottom:0; height:3px; background:#2878b5; }
.page-section { margin-bottom:20px; }
.page-section>header { margin:0 0 10px; }
.assignment-cards { display:grid; grid-template-columns:repeat(2,minmax(220px,1fr)); gap:12px; }
.assignment-cards article { padding:14px; border:1px solid #dde3eb; border-radius:8px; background:#fff; }
.assignment-cards article>span { color:#667085; font-size:10px; }
.assignment-cards h4 { margin:5px 0 10px; }
.assignment-cards b,.assignment-cards small { display:block; }
.assignment-cards small { color:#667085; font-size:9px; }
.completion-ratio { display:flex; align-items:baseline; gap:9px; }
.completion-ratio strong { color:#174f7b; font-size:25px; }
.completion-ratio span { color:#667085; font-size:11px; }
.nps-offering+.nps-offering { margin-top:16px; padding-top:14px; border-top:1px solid #e4e8ee; }
.nps-offering>h4 { margin:0 0 9px; }
.folded-copy { color:#667085; }
.outcome-tabs { position:sticky; top:0; z-index:4; padding:8px 0; background:#f4f6f9; border-bottom:1px solid #dde3eb; }

/* Summary, suggestions and the two retained course-level models. */
.sr-headline { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:16px; }
.sr-headline article { padding:14px 16px; border:1px solid #dde3eb; border-radius:9px; background:#fff; box-shadow:0 1px 2px #1720330d; }
.sr-headline span,.sr-headline small { display:block; color:#667085; font-size:12px; }
.sr-headline strong { display:block; margin:4px 0; color:#1f3a5f; font-size:26px; line-height:1.1; }
.sr-headline small { font-size:11px; line-height:1.45; }
.sr-panel { min-width:0; margin-bottom:16px; padding:18px 20px; border:1px solid #dde3eb; border-radius:9px; background:#fff; box-shadow:0 1px 2px #1720330d; }
.sr-panel>.sr-head { margin:0 0 14px; padding:0 0 12px; border-bottom:1px solid #eceff4; }
.sr-panel>.sr-head h3 { margin:0; color:#172033; font-size:19px; }
.sr-panel>.sr-head p { margin:5px 0 0; color:#667085; font-size:12.5px; line-height:1.5; }
.sr-summary-grid { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:start; }
.sr-prose p { margin:0 0 12px; color:#33405a; font-size:13.5px; line-height:1.68; }
.sr-prose p:last-child { margin-bottom:0; }
.sr-standout { padding:14px 16px; border:1px solid #d8dee7; border-radius:8px; background:#f7f9fc; }
.sr-standout strong { display:block; margin-bottom:9px; color:#1452a3; font-size:12px; letter-spacing:.05em; text-transform:uppercase; }
.sr-standout ul { margin:0; padding:0; list-style:none; }
.sr-standout li { position:relative; margin:0 0 9px; padding-left:15px; color:#475467; font-size:12.5px; line-height:1.5; }
.sr-standout li:last-child { margin-bottom:0; }
.sr-standout li::before { position:absolute; top:6px; left:0; width:6px; height:6px; border-radius:50%; background:#355b88; content:""; }
.sr-group { margin-bottom:22px; }
.sr-group:last-child { margin-bottom:0; }
.sr-group-head { margin:0 0 10px; }
.sr-group-head h3 { margin:0; color:#1452a3; font-size:15px; }
.sr-group-head p { margin:3px 0 0; color:#667085; font-size:12.5px; }
.sr-card { position:relative; display:grid; grid-template-columns:44px minmax(0,1fr); gap:0 12px; margin-bottom:10px; padding:14px 16px 13px 13px; border:1px solid #dde3eb; border-left:4px solid #355b88; border-radius:8px; background:#fff; }
.sr-card.sr-groundwork { border-left-color:#d9792b; }
.sr-num { display:flex; align-items:center; justify-content:center; width:32px; height:32px; margin-top:3px; border-radius:50%; background:#eef4fb; color:#1452a3; font-weight:bold; font-size:15px; }
.sr-groundwork .sr-num { background:#fdf1e6; color:#a2571a; }
.sr-body h4 { margin:5px 0 10px; padding-right:180px; color:#202124; font-size:14.5px; line-height:1.45; }
.sr-body p { margin:0 0 9px; color:#475467; font-size:13px; line-height:1.6; }
.sr-body p:last-child { margin-bottom:0; }
.sr-body p strong { display:block; margin-bottom:2px; color:#667085; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; }
.sr-where { color:#667085 !important; font-style:italic; }
.sr-tag { position:absolute; top:13px; right:14px; padding:3px 10px; border-radius:999px; background:#eef4fb; color:#1452a3; font-size:11px; white-space:nowrap; }
.sr-groundwork .sr-tag { background:#fdf1e6; color:#a2571a; }
.sr-closing { margin:18px 0 0; padding:12px 14px; border-left:3px solid #355b88; background:#f7f9fc; color:#475467; font-size:12.5px; line-height:1.6; }

/* Course-level reference manual. */
.reference-intro { margin-bottom:16px; padding:20px 22px; border:1px solid #cad8e7; border-radius:10px; background:linear-gradient(135deg,#f6f9fd,#eef4fb); }
.reference-intro>span { color:#2878b5; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
.reference-intro h2 { margin:5px 0 6px; color:#172033; font-size:24px; }
.reference-intro p { max-width:780px; margin:0; color:#526075; line-height:1.55; }
.reference-manual { display:grid; gap:18px; }
.reference-section { padding:19px 20px; border:1px solid #dde3eb; border-radius:10px; background:#fff; box-shadow:0 1px 2px #1720330d; }
.reference-section>header { display:flex; min-height:0; gap:14px; align-items:flex-start; justify-content:flex-start; margin-bottom:15px; padding:14px 16px; border:1px solid #d5e1ee; border-radius:8px; color:#172033; background:#eef4fb; }
.reference-section>header>span { display:flex; flex:0 0 34px; height:34px; align-items:center; justify-content:center; border-radius:50%; background:#355b88; color:#fff; font-weight:700; }
.reference-section>header>div { min-width:0; }
.reference-section>header h2 { margin:0; color:#172033; font-size:20px; line-height:1.25; }
.reference-section>header p { margin:5px 0 0; color:#526075; font-size:12.5px; line-height:1.45; }
.source-guide { display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:12px; }
.source-guide-card { padding:14px; border:1px solid #e0e5ec; border-radius:8px; background:#fbfcfe; }
.source-guide-card>header { display:flex; gap:10px; justify-content:space-between; align-items:flex-start; }
.source-guide-card h3 { margin:3px 0 0; font-size:15px; }
.source-guide-card header small { color:#667085; }
.reference-status { padding:4px 8px; border-radius:999px; background:#edf0f4; color:#5b6678; font-size:10px; white-space:nowrap; }
.reference-status.available { background:#e8f5ed; color:#21623b; }
.reference-status.excluded { background:#fff2e1; color:#9a5b12; }
.source-guide-card dl { display:grid; gap:8px; margin:13px 0 0; }
.source-guide-card dl div { display:grid; grid-template-columns:100px 1fr; gap:8px; }
.source-guide-card dt { color:#667085; font-size:11px; }
.source-guide-card dd { margin:0; color:#344054; font-size:12px; line-height:1.45; }
.source-quality { margin:11px 0 0; padding-top:9px; border-top:1px solid #e3e8ef; color:#667085; font-size:10.5px; }
.glossary-group+.glossary-group { margin-top:16px; }
.glossary-group>h3 { margin:0 0 8px; color:#1452a3; font-size:14px; }
.glossary-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:8px; }
.glossary-list article,.limitation-list article { padding:12px 13px; border:1px solid #e2e7ed; border-radius:7px; }
.glossary-list h4,.limitation-list h3 { margin:0 0 5px; color:#27364d; font-size:13px; }
.glossary-list p,.limitation-list p { margin:0; color:#526075; font-size:11.5px; line-height:1.5; }
.glossary-list small { display:block; margin-top:7px; color:#7a8494; font-size:10px; }
.reference-table th { white-space:normal; }
.reference-table tbody th { text-align:left; color:#27364d; }
.limitation-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:8px; }
.target-toolbar { margin-bottom:8px; }
.target-toolbar button,.insight-targets button { border:1px solid #d6dde7; background:#fff; color:#344054; cursor:pointer; }
.target-toolbar button { padding:7px 11px; border-radius:6px; }
.target-toolbar button.active,.insight-targets button.active { border-color:#2878b5; background:#edf6fc; box-shadow:inset 0 0 0 1px #2878b5; }
.insight-targets { display:grid; grid-template-columns:repeat(2,minmax(155px,1fr)); gap:10px; margin-bottom:16px; }
.insight-targets button { padding:13px; border-radius:8px; text-align:left; }
.insight-targets span,.insight-targets strong,.insight-targets small { display:block; }
.insight-targets span { color:#667085; font-size:11px; }
.insight-targets strong { margin:5px 0 9px; font-size:15px; }
.status-pill { display:inline-block; width:max-content; padding:3px 7px; border-radius:10px; background:#eef1f4; color:#5e6979; font-size:10px; }
.status-pill.completed { background:#e8f5ed; color:#21623b; }
.status-pill.insufficient { background:#fff2e1; color:#9a5b12; }
.model-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:16px; }
.model-card { padding:16px; border:1px solid #dde3eb; border-radius:9px; background:#fff; }
.model-card>header { display:flex; margin-bottom:13px; justify-content:space-between; align-items:start; }
.model-card>header>div { display:flex; gap:8px; align-items:center; }
.model-card>header small { color:#667085; }
.model-classes>div:first-child { display:flex; height:20px; overflow:hidden; border-radius:5px; background:#edf0f4; }
.model-classes>div:first-child i { display:block; }
.model-comparison { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:14px; }
.model-comparison section { padding:10px; border:1px solid #e2e7ed; border-radius:6px; }
.model-comparison section.selected { border-color:#438a69; background:#f1f8f4; }
.model-comparison section>div { display:grid; grid-template-columns:90px 1fr 38px; gap:5px; align-items:center; margin-top:7px; font-size:9px; }
.model-comparison section>div>i { height:8px; overflow:hidden; border-radius:4px; background:#edf0f4; }
.model-comparison section>div>i>b { display:block; height:100%; }
.model-reason,.model-warning { padding:9px; border-radius:5px; color:#805515; background:#fff5e7; font-size:11px; }
.model-card .action { margin-top:12px; }

@media (max-width:700px) {
  .viz-grid { grid-template-columns:1fr; }
  .key-insight { grid-template-columns:1fr; }
  .key-insight-actions,.key-insight>small { grid-column:1; }
  .key-insight textarea { width:100%; box-sizing:border-box; }
  .hbar,.stack-row,.likert-row { grid-template-columns:1fr; }
  .hbar b,.stack-row>b { text-align:left; }
  .nps { grid-template-columns:1fr; }
  .nps-breakdown { grid-template-columns:1fr; }
  .insight-targets { grid-template-columns:repeat(2,1fr); }
  .sr-summary-grid { grid-template-columns:1fr; }
  .sr-body h4 { padding-right:0; }
  .sr-tag { position:static; display:inline-block; margin-bottom:5px; }
  .source-guide,.glossary-list,.limitation-list { grid-template-columns:1fr; }
  .model-grid,.model-comparison { grid-template-columns:1fr; }
  .assignment-cards { grid-template-columns:1fr; }
}

/* Per-assignment labels and denominators stay beside their values. */
.assignment-title { margin:0 0 10px; color:#667085; font-size:11px; }
.result-summaries { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
.result-summaries article { padding:12px; border:1px solid #dde3eb; border-radius:7px; }
.result-summaries h4 { margin:0 0 8px; }
.result-summaries dl { display:grid; grid-template-columns:1fr 1.15fr; gap:8px 12px; margin:10px 0; font-size:12px; }
.result-summaries dt { color:#667085; }
.result-summaries dd { margin:0; font-weight:700; color:#344054; }
.result-summaries small { color:#667085; font-size:10px; }
.rule-note { margin:0; color:#475467; font-size:11px; }
.mini-viz .hbar>span { white-space:normal; overflow:visible; }

</style>
</head>

const state = { catalog: null, page: "overview", course: "", offering: "", interval: "day", mode: "scored", supportTopic: "all", insightsTab: "summary", modelTarget: "all" };
const pageNames = {
  overview: "Overview", engagement: "Engagement", assignments: "Assignments",
  outcomes: "Feedback", insights: "Summary & Recommendations", "data-rules": "Data & Rules"
};

const knownLabels = {
  students: "Students", offerings: "Offerings", courses: "Courses", records: "Records",
  macro_f1: "Macro F1", balanced_accuracy: "Balanced Accuracy",
  engagement_students: "Engagement cohort", assignment_students: "Assignment cohort",
  valid_award_holders: "Students with an active Badge", cohort_memberships: "Assignment cohort",
  mean_score_pct: "Mean score (%)", submission_rate_pct: "Submission rate (%)",
};
const cohortLabels = {
  source_specific: "Source-specific cohorts; definitions are in Data & Rules",
  all_engagement: "Engagement cohort for the selected teaching period",
  all_assignment: "Assignment cohort for the selected teaching period",
  completed_qualtrics_responses: "Survey response cohort for the selected teaching period",
  course_separated_student_offering_records: "Model cohort pooled across teaching periods for this course",
  metadata_only: "Course-wide reference information"
};
const colours = ["#355b88", "#d97706", "#16856b", "#8b5cf6", "#dc4c64", "#64748b"];
let pageRequest = 0;
const staticSnapshot = window.__MPE_STATIC_SNAPSHOT__ || null;
const staticMode = Boolean(staticSnapshot);


const el = id => document.getElementById(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, character => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
})[character]);
const label = key => knownLabels[key] || String(key).replaceAll("_", " ").replace(/\b\w/g, character => character.toUpperCase());
const shortLabel = value => String(value).length > 30 ? String(value).slice(0, 27) + "…" : String(value);
const offeringLabel = value => {
  const match = String(value || "").trim().match(/^(?:[A-Z0-9]+[ _-]+)?(\d{4})[ _-]+([A-Z]{3})[ _-]+PAR[ _-]+(\d+)$/i);
  return match ? `${match[1]} ${match[2].toUpperCase()} PAR ${match[3]}` : String(value || "Unknown");
};

async function api(path, options = {}) {
  if (staticMode) {
    const method = (options.method || "GET").toUpperCase();
    if (method !== "GET") throw new Error("This action is available in the internal live application only");
    const url = new URL(path, "https://snapshot.local");
    const query = [...url.searchParams.entries()].sort(([aKey, aValue], [bKey, bValue]) =>
      aKey.localeCompare(bKey) || aValue.localeCompare(bValue));
    const key = url.pathname + (query.length ? `?${new URLSearchParams(query)}` : "");
    const payload = staticSnapshot.responses?.[key];
    if (payload === undefined) throw new Error("This filter combination is not included in the static snapshot");
    return structuredClone(payload);
  }
  const response = await fetch("/api" + path, {
    ...options,
    headers: { "Content-Type": "application/json", ...(options.headers || {}) }
  });
  if (!response.ok) throw new Error(`Request failed (HTTP ${response.status})`);
  return response.json();
}

const chartNotes = createChartNotes({api,state,snapshot:staticSnapshot,showMessage});
el("downloadInsightHtml").hidden = !staticMode;
el("downloadInsightHtml").onclick = chartNotes.download;

function metricValue(metric) {
  if (!metric || metric.value === null || metric.value === undefined) return '<span class="unavailable">Not available</span>';
  if (typeof metric.value === "number") return metric.value.toLocaleString("en-AU", { maximumFractionDigits: 2 });
  return escapeHtml(metric.value);
}

function renderMetrics(metrics) {
  el("metrics").innerHTML = Object.entries(metrics || {}).map(([key, value]) =>
    `<article class="card"><div class="label">${label(key)}</div><div class="value">${metricValue(value)}</div></article>`
  ).join("");
}

function numericKeys(rows) {
  return [...new Set(rows.flatMap(row => Object.entries(row.metrics || {})
    .filter(([, metric]) => typeof metric?.value === "number").map(([key]) => key)))];
}

function preferredMetric(title, keys) {
  const priorities = title.includes("association") ? ["spearman_rho", "within_offering_rank_r"]
    : title.includes("activity") ? ["views", "participations", "students"]
    : title.includes("score") || title.includes("grade") ? ["students", "mean_score_pct", "records"]
    : title.includes("badge") || title.includes("award") ? ["memberships", "holders", "award_records", "records"]
    : ["students", "records", "memberships", "views", "participations"];
  return priorities.find(key => keys.includes(key)) || keys.find(key => !key.endsWith("_n")) || keys[0];
}

function barChart(title, rows, valueKey) {
  const items = rows.filter(row => typeof row.metrics?.[valueKey]?.value === "number").slice(0, 16);
  if (items.length < 2) return "";
  const values = items.map(row => Number(row.metrics[valueKey].value));
  const min = Math.min(0, ...values), max = Math.max(0, ...values);
  const width = 900, rowHeight = 30, top = 24, bottom = 24, labelWidth = 220, right = 65;
  const height = top + bottom + items.length * rowHeight;
  const span = max - min || 1;
  const x = value => labelWidth + (value - min) * (width - labelWidth - right) / span;
  const zero = x(0);
  const rowsSvg = items.map((row, index) => {
    const value = Number(row.metrics[valueKey].value), end = x(value), start = Math.min(zero, end), barWidth = Math.max(Math.abs(end - zero), 1);
    return `<text x="${labelWidth-10}" y="${top+index*rowHeight+18}" text-anchor="end">${escapeHtml(shortLabel(offeringLabel(row.label)))}</text><rect x="${start}" y="${top+index*rowHeight+5}" width="${barWidth}" height="17" rx="2" fill="${value < 0 ? colours[4] : colours[0]}"/><text x="${value < 0 ? start-5 : end+5}" y="${top+index*rowHeight+18}" text-anchor="${value < 0 ? "end" : "start"}">${value.toLocaleString("en-AU", {maximumFractionDigits:2})}</text>`;
  }).join("");
  return `<div class="chart"><div class="chart-title">${label(valueKey)}</div><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(label(valueKey))} bar chart"><line x1="${zero}" y1="${top}" x2="${zero}" y2="${height-bottom}" class="axis"/>${rowsSvg}</svg>${rows.length > items.length ? `<p class="chart-note">Showing the first ${items.length} of ${rows.length} categories. Use the data table for all values.</p>` : ""}</div>`;
}

function renderChart(title, rows) {
  const keys = numericKeys(rows);
  if (!keys.length) return "";
  const key = preferredMetric(title, keys);
  return barChart(title, rows, key);
}

function renderRows(title, rows, open = false) {
  if (!rows?.length) return "";
  if (["survey_feedback_comments", "support_issue_summaries", "analysis_questions"].includes(title)) {
    return `<section class="visual"><h3>${label(title)}</h3><div class="text-grid">${rows.map(row =>
      `<article class="text-card"><div class="text-meta">${escapeHtml(row.dimensions?.question_group || row.dimensions?.topic || row.dimensions?.analysis_area || "")}</div><p>${escapeHtml(row.label)}</p>${row.dimensions?.result ? `<small>${escapeHtml(row.dimensions.result)}</small>` : ""}${row.metrics?.responses ? `<strong>${metricValue(row.metrics.responses)} response${row.metrics.responses.value === 1 ? "" : "s"}</strong>` : ""}</article>`
    ).join("")}</div></section>`;
  }
  const dimensions = [...new Set(rows.flatMap(row => Object.keys(row.dimensions || {})))];
  const metrics = [...new Set(rows.flatMap(row => Object.keys(row.metrics || {})))];
  const headings = ["Item", ...dimensions.map(label), ...metrics.map(label)];
  const body = rows.map(row => `<tr><td>${escapeHtml(offeringLabel(row.label))}</td>${dimensions.map(key =>
    `<td>${escapeHtml(key === "offering" ? offeringLabel(row.dimensions?.[key]) : row.dimensions?.[key] ?? "—")}</td>`).join("")}${metrics.map(key =>
    `<td>${metricValue(row.metrics?.[key])}</td>`).join("")}</tr>`).join("");
  return `<section class="visual"><h3>${label(title)}</h3>${renderChart(title, rows)}<details ${open ? "open" : ""}><summary>View data (${rows.length} rows)</summary><div class="table-wrap"><table><thead><tr>${headings.map(heading =>
    `<th>${heading}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div></details></section>`;
}


function renderTables(data) {
  return Object.entries(data.tables || {}).map(([key, rows], index) => renderRows(key, rows, index === 0)).join("");
}

function currentParams(extra = {}) {
  const params = new URLSearchParams({ course: state.course, ...extra });
  if (state.offering && !["insights", "data-rules"].includes(state.page)) params.set("offering", state.offering);
  return params;
}

function filterMarkup() {
  if (state.page === "engagement") return `<label>Time interval<select id="interval"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option></select></label>`;
  if (state.page === "assignments") return `<label>Assignment type<select id="mode"><option value="combined">All activities</option><option value="scored">Scored</option><option value="self_assessment">Self-assessment</option></select></label>`;
  return "";
}

function bindPageFilters() {
  if (el("interval")) { el("interval").value = state.interval; el("interval").onchange = event => { state.interval = event.target.value; loadPage(); }; }
  if (el("mode")) { el("mode").value = state.mode; el("mode").onchange = event => { state.mode = event.target.value; loadPage(); }; }
}

async function retrain(event) {
  const button = event?.currentTarget;
  if (!button || state.modelTarget === "all") return;
  const originalText = button.textContent;
  button.disabled = true; button.textContent = "Training…";
  try {
    const result = await api("/v1/models/train", { method: "POST", body: JSON.stringify({ course: state.course, target: state.modelTarget }) });
    showMessage(result.already_current ? "Data and configuration are unchanged. The current model remains active." : `Training finished with status: ${result.status}.`);
    await loadPage();
  } catch (error) { showMessage(error.message); }
  finally { if (button.isConnected) { button.disabled = false; button.textContent = originalText; } }
}

function showMessage(message = "") {
  el("message").hidden = !message;
  el("message").textContent = message;
}

async function loadPage() {
  if (!state.course) return;
  const requestId = ++pageRequest;
  document.querySelector("main").classList.add("loading");
  showMessage();
  el("pageTitle").textContent = pageNames[state.page];
  el("pageFilters").innerHTML = filterMarkup();
  bindPageFilters();
  const extra = {};
  if (state.page === "engagement") extra.interval = state.interval;
  if (state.page === "assignments") {
    extra.mode = state.mode;
  }
  try {
    const data = await api(`/v1/${state.page}?${currentParams(extra)}`);
    if (requestId !== pageRequest) return;
    await chartNotes.load();
    const engagementComparison = state.page === "engagement"
      ? await api(`/v1/engagement?${new URLSearchParams({course:state.course,interval:state.interval})}`) : null;
    if (requestId !== pageRequest) return;
    const models = state.page === "insights" ? await api(`/v1/models?${new URLSearchParams({course: state.course})}`) : null;
    if (requestId !== pageRequest) return;
    el("cohort").textContent = `Population included: ${cohortLabels[data.cohort] || label(data.cohort)}`;
    clearSpecialPage(el);
    el("modelPanel").innerHTML = "";
    if (state.page === "insights") {
      renderInsightsPage(data, models, {state, metrics:el("metrics"), coverage:el("coverage"), tables:el("tables"), notes:el("notes"), cohort:el("cohort"), reload:loadPage, retrain, staticMode, enhance:chartNotes.enhance});
    } else if (!renderSpecialPage(data, { state, el, engagementComparison, enhance:chartNotes.enhance })) {
      renderMetrics(data.metrics);
      el("coverage").innerHTML = "";
      el("tables").innerHTML = renderTables(data);
      el("notes").innerHTML = data.notes?.length ? `<div class="panel notes"><h3>Definitions and limitations</h3><ul>${data.notes.map(note => `<li>${escapeHtml(note)}</li>`).join("")}</ul></div>` : "";
    }
    chartNotes.enhance();
  } catch (error) {
    if (requestId !== pageRequest) return;
    showMessage(error.message);
    ["metrics", "coverage", "modelPanel", "tables", "notes"].forEach(id => el(id).innerHTML = "");
  } finally { if (requestId === pageRequest) document.querySelector("main").classList.remove("loading"); }
}

function populateOfferings() {
  const options = state.catalog.offerings.filter(item => item.course === state.course)
    .sort((a, b) => String(b.starts_on || "").localeCompare(String(a.starts_on || "")) || a.code.localeCompare(b.code));
  const allOption = ["overview", "data-rules"].includes(state.page) ? '<option value="">All teaching periods</option>' : "";
  el("offering").innerHTML = allOption + options.map(item =>
    `<option value="${escapeHtml(item.code)}">${escapeHtml(offeringLabel(item.code))} · ${escapeHtml(item.starts_on || "Date unknown")}</option>`).join("");
  if (state.page === "data-rules") state.offering = "";
  else if (!options.some(item => item.code === state.offering) && !(state.page === "overview" && !state.offering)) state.offering = options[0]?.code || "";
  el("offering").value = state.offering;
}

function syncOfferingControl() {
  const pooled = ["insights", "data-rules"].includes(state.page);
  el("offering").disabled = pooled;
  el("offering").value = state.offering;
}

async function start() {
  try {
    const health = await api("/v1/health");
    if (health.database !== "ok") throw new Error("The database is unavailable");
    state.catalog = await api("/v1/catalog");
    el("course").innerHTML = state.catalog.courses.map(item => `<option value="${escapeHtml(item.code)}">${escapeHtml(item.name)}</option>`).join("");
    state.course = state.catalog.courses[0]?.code || "";
    el("course").value = state.course;
    populateOfferings();
    document.querySelector("nav button.active")?.classList.remove("active");
    document.querySelector(`nav button[data-page="${state.page}"]`)?.classList.add("active");
    syncOfferingControl();
    el("course").onchange = event => { state.course = event.target.value; state.offering = ""; populateOfferings(); syncOfferingControl(); loadPage(); };
    el("offering").onchange = event => { state.offering = event.target.value; loadPage(); };
    document.querySelectorAll("nav button").forEach(button => button.onclick = () => {
      document.querySelector("nav button.active")?.classList.remove("active");
      button.classList.add("active"); state.page = button.dataset.page; location.hash = state.page;
      populateOfferings(); syncOfferingControl(); loadPage();
    });
    el("connection").textContent = staticMode
      ? `Static snapshot · ${staticSnapshot.meta?.generated_at?.slice(0, 10) || "date unavailable"}`
      : "Local data service connected";
    el("connection").className = "status ok";
    await loadPage();
  } catch (error) {
    el("connection").textContent = "Connection failed";
    el("connection").className = "status error";
    showMessage(`${error.message}. Confirm that both local services are running.`);
  }
}

start();

</script>
</body>
</html>
